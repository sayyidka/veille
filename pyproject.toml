[project]
name = "veille"
version = "0.1.0"
description = "Topic aggregator: tech & AI in daily life, attention, reading, writing"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
veille = "veille.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["veille", "veille.fetchers"]
