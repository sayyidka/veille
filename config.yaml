# Veille configuration: edit this file to tune topics and sources.
# Keywords are matched case-insensitively and accent-insensitively on title + summary,
# on whole words ("ai" does not match "said"). Weights add up per topic:
#   3 = very specific to a video subject, 2 = clearly related, 1 = weak signal (needs another match).
#
# Themes map to the video subjects:
#   temps_ecrans      → Pourquoi je perds mon temps… / Sortir de l'addiction aux écrans / Le bonheur est dans l'effort (surproductivité)
#   apprendre_lire    → Prendre le temps d'apprendre / Le bonheur est dans l'effort / Être polymathe à l'ère de l'IA / Lire des livres est devenu vital
#   ia_quotidien      → L'IA nous a-t-elle fait gagner du temps libre ? / Compagnon IA (Muse, Dots) / Ce que je ne donne pas à l'IA / Bilan après 4 ans d'IA
#   hype_fomo         → L'avènement de l'IA est-il inéluctable ? FOMO des entreprises / Fatigué de l'actu IA
#   internet_opinion  → Où est passé internet ? / L'économie de l'opinion

settings:
  threshold: 2          # min topic score to keep an item (sources can override with min_score)
  window_days: 30       # items older than this are dropped from the site
  max_per_type: 120     # cap per type (news, forum, study…) so busy sources don't crowd out newsletters
  skeptic_topic: hype_fomo   # sources flagged `skeptic: true` always land in this theme
  user_agent: "veille-aggregator/0.1 (personal research feed)"
  timeout: 20

